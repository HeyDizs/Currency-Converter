<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Updatable Currency Converter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        margin-top: 50px;
        background: #3a3a63;
      }
      .card {
        background: rgb(60, 135, 156);
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 350px;
      }
      .input-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }
      input,
      select {
        padding: 10px;
        font-size: 16px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      h3 {
        text-align: center;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Currency Converter</h3>

      <div class="input-group">
        <label>Amount:</label>
        <input type="number" id="amount" value="1" min="1" />
      </div>

      <div class="input-group">
        <label>From:</label>
        <select id="fromCurrency">
          <option value="USD" selected>USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="AUD">AUD</option>
          <option value="NOK">NGN</option>
        </select>
      </div>

      <div class="input-group">
        <label>To:</label>
        <select id="toCurrency">
          <option value="EUR" selected>EUR</option>
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="AUD">AUD</option>
          <option value="AUD">NGN</option>
        </select>
      </div>

      <h2
        id="result"
        style="text-align: center; margin-top: 20px; color: #2c3e50"
      >
        0.00
      </h2>
    </div>

    <script>
      const amountInput = document.getElementById("amount");
      const fromSelect = document.getElementById("fromCurrency");
      const toSelect = document.getElementById("toCurrency");
      const resultText = document.getElementById("result");

      async function updateConversion() {
        const amount = amountInput.value;
        const from = fromSelect.value;
        const to = toSelect.value;

        if (!amount || amount <= 0) return;
        if (from === to) {
          resultText.innerText = `${amount} ${to}`;
          return;
        }

        try {
          // Ask your local Flask server for data instead of the external API
          const response = await fetch(`/get-rates/${from}`);
          const data = await response.json();

          if (data.rates && data.rates[to]) {
            const rate = data.rates[to];
            const calculated = (amount * rate).toFixed(2);
            resultText.innerText = `${amount} ${from} = ${calculated} ${to}`;
          } else {
            resultText.innerText = "Rate not available.";
          }
        } catch (error) {
          resultText.innerText = "Error updating rates.";
        }
      }

      // Event Listeners trigger updates dynamically whenever the user types or selects choices
      amountInput.addEventListener("input", updateConversion);
      fromSelect.addEventListener("change", updateConversion);
      toSelect.addEventListener("change", updateConversion);

      // Initial run
      updateConversion();
    </script>
  </body>
</html>
