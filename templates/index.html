<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Currency Converter</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="phone-screen">
      <div>
        <div class="header">← Online Currency Converter</div>

        <!-- Base currency input -->
        <div class="currency-row">
          <select id="fromCurrency"></select>
          <div id="amountDisplay" class="amount-display active-amount">100</div>
        </div>

        <!-- Target conversion row -->
        <div class="currency-row">
          <select id="toCurrency"></select>
          <div id="resultDisplay" class="amount-display">0.00</div>
        </div>
      </div>

      <!-- On-screen Keyboard/Pinpad Layout -->
      <div class="pinpad">
        <button class="btn" onclick="pressKey('7')">7</button>
        <button class="btn" onclick="pressKey('8')">8</button>
        <button class="btn" onclick="pressKey('9')">9</button>
        <button class="btn btn-action" onclick="pressKey('AC')">AC</button>

        <button class="btn" onclick="pressKey('4')">4</button>
        <button class="btn" onclick="pressKey('5')">5</button>
        <button class="btn" onclick="pressKey('6')">6</button>

        <button class="btn" onclick="pressKey('1')">1</button>
        <button class="btn" onclick="pressKey('2')">2</button>
        <button class="btn" onclick="pressKey('3')">3</button>
        <button class="btn btn-backspace" onclick="pressKey('DEL')">⌫</button>

        <button class="btn" onclick="pressKey('00')">00</button>
        <button class="btn" onclick="pressKey('0')">0</button>
        <button class="btn" onclick="pressKey('.')">.</button>
      </div>
    </div>

    <script>
      let currentInput = "100";
      const fromSelect = document.getElementById("fromCurrency");
      const toSelect = document.getElementById("toCurrency");
      const amountDisplay = document.getElementById("amountDisplay");
      const resultDisplay = document.getElementById("resultDisplay");

      async function loadAllCurrencies() {
        try {
          const response = await fetch("/get_rates/USD");
          const data = await response.json();

          if (data.rates) {
            Object.keys(data.rates).forEach((code) => {
              let option1 = new Option(code, code);
              let option2 = new Option(code, code);

              fromSelect.add(option1);
              toSelect.add(option2);
            });

            fromSelect.value = "NGN";
            toSelect.value = "USD";

            updateConversion();
          }
        } catch (e) {
          console.error("Could not fetch currencies:", e);
        }
      }

      // STEP 2: Logic capturing whenever custom layout buttons are pressed
      function pressKey(key) {
        if (key === "AC") {
          currentInput = "0";
        } else if (key === "DEL") {
          currentInput = currentInput.slice(0, -1);
          if (currentInput === "") currentInput = "0";
        } else {
          if (currentInput === "0" && key !== ".") currentInput = "";
          if (key === "." && currentInput.includes(".")) return; // Stop double dots
          currentInput += key;
        }
        amountDisplay.innerText = currentInput;
        updateConversion();
      }

      async function updateConversion() {
        const from = fromSelect.value;
        const to = toSelect.value;
        const amount = parseFloat(currentInput) || 0;

        if (amount === 0) {
          resultDisplay.innerText = "0.00";
          return;
        }

        try {
          const response = await fetch(`/get_rates/${from}`);
          const data = await response.json();

          if (data.rates && data.rates[to]) {
            const rate = data.rates[to];

            resultDisplay.innerText = (amount * rate).toLocaleString(
              undefined,
              {
                minimumFractionDigits: 2,
                maximumFractionDigits: 4,
              },
            );
          }
        } catch (error) {
          console.error(error);
          resultDisplay.innerText = "Error";
        }
      }

      fromSelect.addEventListener("change", updateConversion);
      toSelect.addEventListener("change", updateConversion);

      // Bootstrap app start
      loadAllCurrencies();
    </script>
  </body>
</html>
