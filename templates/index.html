<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live exchange rates at your fingertips. Currency converter with real-time rates.">
  <title>Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="shortcut icon" href="download.jpeg" type="image/x-icon">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <img src="/static/logo.png" class="logo-img" alt="Swapp">
    </div>
  </header>

  <main class="hero">

    <img class="coin-bg" src="/static/bg.png" alt="" aria-hidden="true">



    <div class="card" id="converterCard">

      <div class="card-block">
        <label class="field-label" for="amountInput">Base Currency</label>
        <div class="field-row">
          <button type="button" class="currency-picker" id="fromCurrencyBtn" aria-label="Select base currency">
            <span class="flag" id="fromFlag">🇺🇸</span>
            <span class="currency-code-text" id="fromCode">USD</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <input
            id="amountInput"
            class="field-amount"
            type="text"
            inputmode="decimal"
            value="1000"
            aria-label="Amount to convert"
          >
        </div>
      </div>

      <div class="card-block">
        <span class="field-label">Converted to</span>
        <div class="field-row">
          <button type="button" class="currency-picker" id="toCurrencyBtn" aria-label="Select target currency">
            <span class="flag" id="toFlag">🇪🇺</span>
            <span class="currency-code-text" id="toCode">EUR</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <span class="field-result" id="convertedResult">—</span>
        </div>
      </div>

      <div class="card-block card-meta">
        <div class="meta-row">
          <span class="meta-label">
            Our current rate
            <span class="info-icon" title="Mid-market rate">ⓘ</span>
          </span>
          <span class="meta-value" id="rateDisplay">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">
            No fees
            <span class="info-icon" title="No conversion fees added">ⓘ</span>
          </span>
          <span class="meta-value" id="feesDisplay">$0.00</span>
        </div>
      </div>

      <button class="cta-btn" id="convertBtn" type="button">Get live rate</button>

      <div class="card-status hidden" id="statusBanner" role="status">
        <span class="spinner"></span>
        <span id="statusMessage">Fetching rates…</span>
      </div>

    </div>

  </main>

  <!-- Currency Selector Modal -->
  <div class="modal-backdrop hidden" id="currencyModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Select currency</h2>
        <button type="button" class="modal-close" id="modalCloseBtn" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="currencySearchInput" class="modal-search-input" placeholder="Search by name or code (e.g. USD, Euro)..." autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-list" id="currencyList">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
