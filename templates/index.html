<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live exchange rates at your fingertips. Currency converter with real-time rates.">
  <title>Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span>Swapp</span>
    </div>
  </header>

  <main class="hero">

    <img class="coin-bg" src="/static/bg.png" alt="" aria-hidden="true">

    <div class="hero-copy">
      <!-- <p class="eyebrow">Live exchange rates at your fingertips</p> -->
      <h1>Currency converter</h1>
      <p class="hero-desc">
        Exchange, send, and spend with rates you'll love. Check out our live foreign exchange rates with our currency converter and see for yourself why millions of users trust us.
      </p>
    </div>

    <div class="card" id="converterCard">

      <div class="card-block">
        <label class="field-label" for="amountInput">Amount</label>
        <div class="field-row">
          <div class="currency-picker">
            <span class="flag" id="fromFlag">🇺🇸</span>
            <select id="fromCurrencySelect" aria-label="Base currency"></select>
            <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <input
            id="amountInput"
            class="field-amount"
            type="text"
            inputmode="decimal"
            value="1000"
            aria-label="Amount to convert"
          >
        </div>
      </div>
      
      <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap currencies">⇄</button>

      <div class="card-block">
        <span class="field-label">Converted to</span>
        <div class="field-row">
          <div class="currency-picker">
            <span class="flag" id="toFlag">🇪🇺</span>
            <select id="toCurrencySelect" aria-label="Target currency"></select>
            <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <span class="field-result" id="convertedResult">—</span>
        </div>
      </div>

      <div class="card-block card-meta">
        <div class="meta-row">
          <span class="meta-label">
            Our current rate
            <span class="info-icon" title="Mid-market rate">ⓘ</span>
          </span>
          <span class="meta-value" id="rateDisplay">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">
            No fees
            <span class="info-icon" title="No conversion fees added">ⓘ</span>
          </span>
          <span class="meta-value" id="feesDisplay">$0.00</span>
        </div>
      </div>

      <button class="cta-btn" id="convertBtn" type="button">Convert now</button>

      <div class="card-status hidden" id="statusBanner" role="status">
        <span class="spinner"></span>
        <span id="statusMessage">Fetching rates…</span>
      </div>

    </div>

  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
